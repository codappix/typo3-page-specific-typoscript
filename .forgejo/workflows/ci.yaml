name: 'CI'

'on':
  pull_request:

jobs:
  base-qa:
    runs-on: 'self-hosted'
    container:
      image: 'code.codappix.com/globals/docker/ci:latest'
    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'actions/local/qa-forgejo-folder@v1'

      - uses: 'actions/local/qa-typos@v1'

      - run: 'update-alternatives --set php /usr/bin/php8.3'

      - name: 'Validate composer.json'
        run: 'composer validate'

      - name: 'Install PHP dependencies'
        run: 'composer update --prefer-dist --no-progress'

      - name: 'Coding Guideline'
        run: './vendor/bin/php-cs-fixer fix --dry-run --diff'

      - name: 'Lint PHPUnit configuration file'
        uses: 'actions/local/qa-xmllint@v1'
        with:
          schema: 'vendor/phpunit/phpunit/phpunit.xsd'
          file: 'phpunit.xml.dist'

  advanced-qa:
    runs-on: 'self-hosted'
    container:
      image: 'code.codappix.com/globals/docker/ci:latest'
    needs:
      - 'base-qa'
    strategy:
      matrix:
        include:
          - php-version: '8.1'
            typo3-version: '^12.4'
          - php-version: '8.2'
            typo3-version: '^12.4'
          - php-version: '8.3'
            typo3-version: '^12.4'
          - php-version: '8.4'
            typo3-version: '^12.4'
          - php-version: '8.2'
            typo3-version: '^13.4'
          - php-version: '8.3'
            typo3-version: '^13.4'
          - php-version: '8.4'
            typo3-version: '^13.4'
    steps:
      - uses: 'actions/checkout@v6'

      - run: 'update-alternatives --set php /usr/bin/php${{ matrix.php-version }}'

      - name: 'PHP lint'
        run: "find .*.php Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l"

      - name: 'Install dependencies with expected TYPO3 version'
        run: 'composer require --prefer-dist --no-progress "typo3/cms-core:${{ matrix.typo3-version }}"'

      - name: 'Dependency Check'
        run: './vendor/bin/composer-dependency-analyser'

      - name: 'Code Quality (by PHPStan)'
        run: './vendor/bin/phpstan analyse'

      - name: 'PHPUnit Tests'
        run: './vendor/bin/phpunit --testdox'
